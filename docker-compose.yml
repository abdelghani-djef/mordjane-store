# The shop's containers: mordjane-db, -api, -front and -backup (see README).
# Copy .env.example to .env and fill it in before `docker compose up -d --build`.
name: mordjane

services:
  mordjane-db:
    image: postgres:17
    container_name: mordjane-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mordjane}
      POSTGRES_USER: ${POSTGRES_USER:-mordjane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Host access on localhost only (psql, backups); containers use the internal network.
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - mordjane-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mordjane-api:
    build: ./backend
    image: mordjane-api
    container_name: mordjane-api
    restart: unless-stopped
    depends_on:
      mordjane-db:
        condition: service_healthy
    # MAIL_ENABLED and any other backend settings come straight from .env.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mordjane}:${POSTGRES_PASSWORD}@mordjane-db:5432/${POSTGRES_DB:-mordjane}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      MEDIA_DIR: /data/media
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://elmordjane.kwin.tn}
      # Emails go through Gmail (configured in backend/app/mail.py).
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
    volumes:
      - mordjane-media:/data/media

  mordjane-front:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://mordjane-api:8000
    image: mordjane-front
    container_name: mordjane-front
    restart: unless-stopped
    depends_on:
      mordjane-api:
        condition: service_healthy
    ports:
      - "${FRONT_PORT:-3000}:3000"

  # Every day at midnight (Tunis time): pg_dump into ~/mordjane_db_backups, keep 14 days.
  mordjane-backup:
    image: postgres:17
    container_name: mordjane-backup
    restart: unless-stopped
    depends_on:
      mordjane-db:
        condition: service_healthy
    environment:
      PGHOST: mordjane-db
      PGDATABASE: ${POSTGRES_DB:-mordjane}
      PGUSER: ${POSTGRES_USER:-mordjane}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: Africa/Tunis
    volumes:
      - ~/mordjane_db_backups:/backups
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          sleep $$(( $$(date -d 'tomorrow 00:00' +%s) - $$(date +%s) ))
          pg_dump --format=custom --file=/backups/mordjane-$$(date +%F).dump && echo "backup done: mordjane-$$(date +%F).dump"
          find /backups -name 'mordjane-*.dump' -mtime +14 -delete
        done

volumes:
  mordjane-db-data:
  mordjane-media:
